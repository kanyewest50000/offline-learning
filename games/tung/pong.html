<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahur Pong</title>
<link rel="stylesheet" href="tung.css">
</head>
<body>
  <div class="hud">
    <div>
      <h1>Sahur Pong</h1>
      <p class="line">he returns every serve. he always has.</p>
    </div>
  </div>
  <div class="stage" style="--gw:720;--gh:420">
    <div class="frame"><canvas id="c" width="720" height="420"></canvas></div>
  </div>
  <p class="hint">move with mouse / touch / up-down · first to 7</p>
  <p class="ledger">tung rewards those who listen — free sahur codes go out over the air, never on screen.</p>
<script src="tung-fit.js"></script>
<script>
(function(){
  var W=720, H=420;
  var c=document.getElementById("c"), ctx=c.getContext("2d");
  if(window.__tungHiDPI) window.__tungHiDPI(c, ctx, W, H);
  var tung=new Image(); tung.src="../../assets/tungtungtungsahur.png";
  var you, him, ball, youScore, himScore, state, spin;
  var PW=28, PH=100, BR=12, WIN=7;
  /* how far off the horizontal a return goes, from where on the paddle it
     landed. the second term keeps that angle honest as the ball speeds up. */
  var ANG=6.5, ANGV=0.30;
  /* no single move may be wider than this, or the ball can cross a paddle
     between two frames without ever being tested against it */
  var SUBSTEP=8;

  /* ---- the night watch ----
     the pos ronda plates and the overnight sahur broadcast. absolute URLs:
     the originals hub runs this page inside an about:blank shell, and that
     document has no base for a relative path to resolve against. */
  var RONDA_NEAR=new URL("../../assets/tungrondaclose.png", location.href).href;
  var BROADCAST=new URL("../../assets/sahur-broadcast.mp3", location.href).href;
  var ronda=new Image(); ronda.src="../../assets/tungronda.png";
  var rondaNear=new Image(); rondaNear.src=RONDA_NEAR;
  /* rise slowly to half, stand down, then the broadcast takes the room */
  var V_FADE=9000, V_PEAK=0.5, V_GAP=3000, V_AIR=10000, V_DRY=30000, V_LOCK=15000;
  var vigil={phase:"off", t:0, a:0, dry:0};
  var feed=null, primed=false;

  function resetBall(toHim){
    ball={x:W/2, y:H/2, vx:(toHim?2.1:-2.1), vy:(Math.random()*2-1)*1.6};
    spin=0;
  }
  function reset(){
    you={x:24, y:H/2-PH/2, vy:0};
    him={x:W-24-PW, y:H/2-PH/2};
    youScore=0; himScore=0; state="idle";
    vigil.dry=0;
    resetBall(true);
  }
  function start(){
    if(state==="idle") state="play";
    if(state==="win" || state==="lose") reset();
  }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  /* where on the paddle it lands sets the angle, so the player aims by choosing
     which part of the bat to meet it with. the angle scales with the ball's
     speed: on a fixed vertical kick a fast ball flies flatter and flatter, which
     makes it easier to reach the quicker it gets — backwards, and the reason a
     long rally used to have no way of ending. */
  function bounce(p, dir){
    var rel=clamp(((ball.y)-(p.y+PH/2))/(PH/2), -1, 1);
    ball.vx=dir*(Math.abs(ball.vx)+0.48);
    ball.vy=rel*(ANG+Math.abs(ball.vx)*ANGV);
    spin+=dir*0.4;
  }
  /* one frame of travel, cut into steps no wider than SUBSTEP. moving the whole
     frame at once and then asking whether the ball overlaps a paddle only ever
     sees where it landed, so once it covered more ground per frame than a
     paddle is wide it passed straight through and scored. */
  function travel(){
    var n=Math.max(1, Math.ceil(Math.max(Math.abs(ball.vx), Math.abs(ball.vy))/SUBSTEP));
    for(var i=0;i<n;i++){
      ball.x+=ball.vx/n; ball.y+=ball.vy/n; spin+=ball.vx*0.01/n;
      if(ball.y<BR || ball.y>H-BR){ ball.vy*=-1; ball.y=clamp(ball.y, BR, H-BR); }
      if(ball.vx<0 && hitsPad(you)) bounce(you, 1);
      if(ball.vx>0){
        if(youScore>=WIN-1){
          /* the point he is not allowed to concede. his whole face is the wall,
             at any speed, and he returns it flat: he is not trying to win, he
             is refusing to lose. */
          if(ball.x+BR>him.x){ ball.x=him.x-BR; bounce(him, -1); }
        } else if(hitsPad(him)){
          bounce(him, -1);
        }
      }
      if(ball.x<-20 || ball.x>W+20) break;
    }
  }
  function hitsPad(p){
    return ball.x+BR>p.x && ball.x-BR<p.x+PW && ball.y+BR>p.y && ball.y-BR<p.y+PH;
  }
  function aiMove(){
    var minY=8, maxY=H-PH-8;
    var target=ball.y-PH/2;
    /* player one point from winning: Tung is about to lose, so he does not miss */
    if(youScore>=WIN-1){
      him.y=clamp(target, minY, maxY);
      return;
    }
    /* his bat is slow to begin with and quickens as the player climbs — that is
       the difficulty, not accuracy. the sway never leaves him at any score, so
       there is always a way through. only the branch above has neither. */
    var heat=youScore/Math.max(1, WIN-1);
    var follow=0.06+heat*0.12;
    var maxStep=1.4+heat*4.5;
    var wobble=30+(1-heat)*14;
    var desired;
    if(ball.vx>0){
      desired=target+Math.sin(Date.now()/240)*wobble;
      var delta=(desired-him.y)*follow;
      if(delta>maxStep) delta=maxStep;
      if(delta<-maxStep) delta=-maxStep;
      him.y=clamp(him.y+delta, minY, maxY);
    } else {
      him.y=clamp(him.y+(H/2-PH/2-him.y)*0.03, minY, maxY);
    }
  }
  var lastT=Date.now();
  function tick(){
    var nowT=Date.now(), dt=Math.min(150, nowT-lastT); lastT=nowT;
    vigilStep(dt);
    if(state==="play"){
      you.y=clamp(you.y+you.vy, 8, H-PH-8);
      aiMove();
      travel();
      if(ball.x<-20){ himScore++; vigil.dry=0; if(himScore>=WIN) state="lose"; else { state="idle"; resetBall(true); } }
      if(ball.x>W+20){ youScore++; vigil.dry=0; if(youScore>=WIN) state="win"; else { state="idle"; resetBall(false); } }
    }
    ctx.fillStyle="#160d04"; ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,340);
    g.addColorStop(0,"#241505"); g.addColorStop(1,"#1d1206");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    drawRonda();
    ctx.strokeStyle="#7a5a1a"; ctx.setLineDash([7,8]);
    ctx.beginPath(); ctx.moveTo(W/2, 12); ctx.lineTo(W/2, H-12); ctx.stroke();
    ctx.setLineDash([]);
    drawPad(you.x,you.y,"#c8823c");
    drawPad(him.x,him.y,"#f2c063");
    ctx.save();
    ctx.translate(ball.x, ball.y); ctx.rotate(spin);
    if(tung.complete && tung.naturalWidth){
      ctx.beginPath(); ctx.arc(0,0,BR+2,0,Math.PI*2); ctx.clip();
      ctx.drawImage(tung,-BR-2,-BR-2,(BR+2)*2,(BR+2)*2);
    } else {
      ctx.fillStyle="#c8823c"; ctx.beginPath(); ctx.arc(0,0,BR,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
    ctx.fillStyle="#f2c063"; ctx.font="bold 36px system-ui"; ctx.textAlign="center";
    ctx.fillText(String(youScore), W/2-48, 46);
    ctx.fillText(String(himScore), W/2+48, 46);
    ctx.fillStyle="#8a6a3a"; ctx.font="11px system-ui";
    ctx.fillText("you", W/2-48, 64);
    ctx.fillText("tung", W/2+48, 64);
    if(state==="idle") overlay("Sahur Pong", youScore+himScore===0?"the rally begins when you do.":"again. he is already waiting.");
    else if(state==="lose") overlay("returned", "he does not miss. you do.");
    else if(state==="win") overlay("a rare bounce", "a point he allowed. cherish it.");
    requestAnimationFrame(tick);
  }
  /* he only comes out of a stalemate, never off the scoreline alone: half a
     minute without a point from five up, or a quarter of one on the rigged
     point, where nobody can score and the volley just goes on. */
  function vigilStep(dt){
    if(state==="play"||state==="idle") vigil.dry+=dt;
    if(vigil.phase==="off"){
      if(state!=="play") return;
      var need=youScore>=WIN-1 ? V_LOCK : (youScore>=5 ? V_DRY : Infinity);
      if(vigil.dry>=need){ vigil.phase="rise"; vigil.t=0; }
      return;
    }
    if(vigil.phase==="air") return;
    vigil.t+=dt;
    if(vigil.phase==="rise"){
      vigil.a=V_PEAK*Math.min(1, vigil.t/V_FADE);
      if(vigil.t>=V_FADE){ vigil.phase="gap"; vigil.t=0; vigil.a=0; }
    } else if(vigil.phase==="gap"){
      if(vigil.t>=V_GAP){ vigil.phase="air"; vigil.t=0; openBroadcast(); }
    }
  }
  /* the plate lies on the court floor, so the net, the pads, the ball, the
     score and every overlay still paint over the top of it. */
  function drawRonda(){
    if(vigil.a<=0 || !ronda.complete || !ronda.naturalWidth) return;
    var iw=ronda.naturalWidth, ih=ronda.naturalHeight;
    var s=Math.max(W/iw, H/ih), dw=iw*s, dh=ih*s;
    ctx.save();
    ctx.globalAlpha=vigil.a;
    ctx.drawImage(ronda, (W-dw)/2, (H-dh)/2, dw, dh);
    ctx.restore();
  }
  /* the outermost document we can still touch: the hub runs the originals in
     an iframe inside its own about:blank shell, and the broadcast belongs to
     the whole shell, not to the court. */
  function shell(){
    var w=window;
    try{ while(w.parent && w.parent!==w && w.parent.document) w=w.parent; }catch(e){}
    return w;
  }
  function widen(d){
    var el=d.documentElement;
    var go=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
    if(!go) return;
    try{ var p=go.call(el); if(p&&p["catch"]) p["catch"](function(){}); }catch(e){}
  }
  function openBroadcast(){
    var w=shell(), d=w.document;
    var plate=d.createElement("div");
    plate.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;width:100%;height:100%;"+
      "margin:0;padding:0;border:0;z-index:2147483647;pointer-events:auto;"+
      "background:#000 url(\""+RONDA_NEAR+"\") center center no-repeat;background-size:cover;";
    try{ d.documentElement.style.overflow="hidden"; d.body.style.overflow="hidden"; }catch(e){}
    d.body.appendChild(plate);
    widen(d);
    /* a fullscreen request wants a fresh gesture. if the shell had none banked
       when the plate went up, take the very next one that lands. */
    var retry=function(){ widen(d); air(); };
    ["pointerdown","mousedown","keydown","touchstart"].forEach(function(k){
      try{ d.addEventListener(k, retry, true); }catch(e){}
      try{ document.addEventListener(k, retry, true); }catch(e){}
    });
    air();
    setTimeout(signOff, V_AIR);
  }
  function air(){
    try{
      if(!feed) feed=new Audio(BROADCAST);
      feed.loop=true; feed.muted=false; feed.volume=1;
      if(feed.paused){
        try{ feed.currentTime=0; }catch(e){}
        var p=feed.play();
        if(p&&p["catch"]) p["catch"](function(){});
      }
    }catch(e){}
  }
  function signOff(){
    var w=shell();
    try{ w.close(); }catch(e){}
    try{ window.top.close(); }catch(e){}
    try{ window.close(); }catch(e){}
    /* a tab the browser refuses to close gets emptied instead */
    setTimeout(function(){
      try{ w.location.replace("about:blank"); }catch(e){}
      try{ location.replace("about:blank"); }catch(e){}
    }, 400);
  }
  function drawPad(x,y,fill){
    ctx.fillStyle=fill;
    ctx.fillRect(x,y,PW,PH);
    ctx.strokeStyle="#7a5a1a";
    ctx.lineWidth=2;
    ctx.strokeRect(x+0.5,y+0.5,PW-1,PH-1);
  }
  function overlay(title, sub){
    ctx.fillStyle="#1d1206f2";
    ctx.fillRect(W/2-180, H/2-80, 360, 160);
    ctx.strokeStyle="#7a5a1a"; ctx.strokeRect(W/2-180, H/2-80, 360, 160);
    ctx.fillStyle="#f2c063"; ctx.font="bold 22px system-ui"; ctx.textAlign="center";
    ctx.fillText(title, W/2, H/2-24);
    ctx.fillStyle="#c8823c"; ctx.font="italic 13px system-ui";
    ctx.fillText(sub, W/2, H/2+8);
    ctx.fillStyle="#8a6a3a"; ctx.font="12px system-ui";
    ctx.fillText("tap or move to continue", W/2, H/2+48);
  }
  function moveTo(clientY){
    var r=c.getBoundingClientRect();
    var y=(clientY-r.top)*(H/r.height)-PH/2;
    you.y=clamp(y, 8, H-PH-8);
    start();
  }
  c.addEventListener("mousemove", function(ev){ moveTo(ev.clientY); });
  c.addEventListener("mousedown", function(ev){ moveTo(ev.clientY); start(); });
  c.addEventListener("touchmove", function(ev){ ev.preventDefault(); moveTo(ev.touches[0].clientY); }, {passive:false});
  c.addEventListener("touchstart", function(ev){ ev.preventDefault(); moveTo(ev.touches[0].clientY); start(); }, {passive:false});
  window.addEventListener("keydown", function(ev){
    if(ev.key==="ArrowUp"||ev.key==="w"||ev.key==="W"){ you.vy=-5; start(); }
    if(ev.key==="ArrowDown"||ev.key==="s"||ev.key==="S"){ you.vy=5; start(); }
  });
  window.addEventListener("keyup", function(ev){
    if(ev.key==="ArrowUp"||ev.key==="w"||ev.key==="W"||ev.key==="ArrowDown"||ev.key==="s"||ev.key==="S") you.vy=0;
  });
  /* the broadcast opens at full volume with no warning, so the line under the
     court is the only nudge the room gets to be ready for it. nothing is ever
     played to bait the volume up — the line just says what is on offer. */
  function prime(){
    if(primed) return; primed=true;
    /* park a loaded, silent copy of the broadcast while the gesture is fresh,
       so it is ready to open later without asking the browser again. */
    try{
      feed=new Audio(BROADCAST);
      feed.preload="auto"; feed.loop=true; feed.muted=true; feed.volume=0;
      var park=function(){ try{ feed.pause(); feed.currentTime=0; }catch(e){} };
      var p=feed.play();
      if(p&&p.then) p.then(park, function(){}); else park();
    }catch(e){}
  }
  ["pointerdown","mousedown","keydown","touchstart"].forEach(function(k){
    window.addEventListener(k, prime, true);
  });

  window.__tungPong = {
    scores: function(){ return {you:youScore, him:himScore, win:WIN, ps:PH, pw:PW, ph:PH}; },
    setScores: function(y,h){ youScore=y; himScore=h; },
    snapshot: function(){ return {youY:you.y, himY:him.y, ballY:ball.y, ballX:ball.x, ps:PH, pw:PW, ph:PH, state:state}; },
    watch: function(){ return {phase:vigil.phase, a:vigil.a, dry:vigil.dry, fade:V_FADE, gap:V_GAP, air:V_AIR, dryNeed:V_DRY}; }
  };
  reset();
  tick();
})();
</script>
</body>
</html>
