<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sahur Snake</title>
<link rel="stylesheet" href="tung.css">
</head>
<body>
  <div class="hud">
    <div>
      <h1>Sahur Snake</h1>
      <p class="line">eat. lengthen. forget why.</p>
    </div>
  </div>
  <div class="stage" style="--gw:432;--gh:432">
    <div class="frame"><canvas id="c" width="432" height="432"></canvas></div>
  </div>
  <p class="hint">arrows / wasd / swipe · cursed relics reverse you · a glowing square is a warning</p>
<script src="tung-fit.js"></script>
<script>
(function(){
  var N=18, CELL=24, W=N*CELL, H=N*CELL;
  var c=document.getElementById("c"), ctx=c.getContext("2d");
  if(window.__tungHiDPI) window.__tungHiDPI(c, ctx, W, H);
  var tung=new Image(); tung.src="../../assets/tungtungtungsahur.png";
  var god=new Image(); god.src="../../assets/tungtunggod.png";
  var evil=new Image(); evil.src="../../assets/eviltungtungtungsahur.jpg";
  var snake, dir, next, food, cursed, score, best, state, tickAcc, last, clock;
  var warn, foe, nextFoeAt, deathKind;
  try{best=parseInt(localStorage.getItem("sahur-snake-best")||"0",10)||0;}catch(e){best=0;}
  var STEP=180;
  var DEMO=/\bdemo\b/.test(location.search||"");
  var WARN_MS=DEMO?900:2600;
  var FOE_MIN=DEMO?200:3500, FOE_SPAN=DEMO?0:3500;
  var STAY_MIN=6500, STAY_SPAN=3500;

  function onSnake(x,y){
    for(var i=0;i<snake.length;i++) if(snake[i].x===x && snake[i].y===y) return true;
    return false;
  }
  function reserved(x,y){
    if(onSnake(x,y)) return true;
    if(food && food.x===x && food.y===y) return true;
    if(cursed && cursed.x===x && cursed.y===y) return true;
    if(warn && warn.x===x && warn.y===y) return true;
    if(foe && foe.x===x && foe.y===y) return true;
    return false;
  }
  function firstFree(){
    for(var y=0;y<N;y++) for(var x=0;x<N;x++) if(!reserved(x,y)) return {x:x,y:y};
    return null;
  }
  function emptyCell(){
    var tries=0, x, y;
    do { x=(Math.random()*N)|0; y=(Math.random()*N)|0; tries++; }
    while(reserved(x,y) && tries<80);
    if(!reserved(x,y)) return {x:x,y:y};
    return firstFree()||{x:x,y:y};
  }
  function pickClearCell(){
    if(DEMO){
      var prefer=[{x:14,y:9},{x:15,y:9},{x:13,y:9}];
      for(var i=0;i<prefer.length;i++) if(!reserved(prefer[i].x, prefer[i].y)) return prefer[i];
    }
    var tries=0, x, y;
    do { x=(Math.random()*N)|0; y=(Math.random()*N)|0; tries++; }
    while(reserved(x,y) && tries<200);
    if(!reserved(x,y)) return {x:x,y:y};
    return firstFree();
  }
  function scheduleFoe(now){
    nextFoeAt=now+FOE_MIN+Math.random()*FOE_SPAN;
  }
  function clearHazard(){ warn=null; foe=null; nextFoeAt=0; }
  function reset(){
    snake=DEMO?[{x:2,y:9},{x:1,y:9},{x:0,y:9}]:[{x:8,y:9},{x:7,y:9},{x:6,y:9}];
    dir={x:1,y:0}; next={x:1,y:0};
    food=null; cursed=null; score=0; state="idle"; tickAcc=0; deathKind="self";
    clearHazard();
    food=emptyCell();
    if(DEMO && food && food.x===14 && food.y===9) food={x:8,y:3};
  }
  function die(kind){
    state="dead";
    deathKind=kind||"self";
    if(score>best){best=score; try{localStorage.setItem("sahur-snake-best",String(best));}catch(e){}}
  }
  function start(){
    if(state==="dead"){ reset(); state="play"; return; }
    if(state==="idle") state="play";
  }
  function setDir(x,y){
    start();
    if(state!=="play") return;
    if(dir.x===-x && dir.y===-y) return;
    next={x:x,y:y};
  }
  function step(){
    dir=next;
    var head={x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=N||head.y>=N){ die("wall"); return; }
    for(var i=0;i<snake.length;i++) if(snake[i].x===head.x && snake[i].y===head.y){ die("self"); return; }
    if(foe && head.x===foe.x && head.y===foe.y){ die("evil"); return; }
    snake.unshift(head);
    if(food && head.x===food.x && head.y===food.y){
      score+=1; food=emptyCell();
      if(score%3===0) cursed=emptyCell();
    } else if(cursed && head.x===cursed.x && head.y===cursed.y){
      score+=5; cursed=null;
      snake.reverse();
      if(snake.length>1){
        dir={x:snake[0].x-snake[1].x, y:snake[0].y-snake[1].y};
        if(!dir.x && !dir.y) dir={x:-next.x,y:-next.y};
      } else dir={x:-dir.x,y:-dir.y};
      next=dir;
    } else {
      snake.pop();
    }
  }
  function cell(x,y, fill, stroke){
    ctx.fillStyle=fill;
    ctx.strokeStyle=stroke||"#7a5a1a";
    ctx.lineWidth=2;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x*CELL+2,y*CELL+2,CELL-4,CELL-4,6); else ctx.rect(x*CELL+2,y*CELL+2,CELL-4,CELL-4);
    ctx.fill(); ctx.stroke();
  }
  function sprite(img, x, y){
    var px=x*CELL+2, py=y*CELL+2, s=CELL-4;
    if(img.complete && img.naturalWidth){
      ctx.save();
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(px,py,s,s,6); else ctx.rect(px,py,s,s);
      ctx.clip();
      ctx.drawImage(img,px,py,s,s);
      ctx.restore();
      ctx.strokeStyle="#7a5a1a"; ctx.strokeRect(px+0.5,py+0.5,s-1,s-1);
    } else cell(x,y,"#c8823c");
  }
  function overlay(title, sub){
    ctx.fillStyle="#1d1206f2";
    ctx.fillRect(36, 150, W-72, 180);
    ctx.strokeStyle="#7a5a1a"; ctx.strokeRect(36, 150, W-72, 180);
    ctx.fillStyle="#f2c063"; ctx.font="bold 22px system-ui"; ctx.textAlign="center";
    ctx.fillText(title, W/2, 208);
    ctx.fillStyle="#c8823c"; ctx.font="italic 13px system-ui";
    wrap(sub, W/2, 238, W-110, 18);
    ctx.fillStyle="#8a6a3a"; ctx.font="12px system-ui";
    ctx.fillText("tap or press a direction", W/2, 298);
  }
  function wrap(t,x,y,max,lh){
    var words=t.split(" "), line="", yy=y;
    for(var i=0;i<words.length;i++){
      var test=line?line+" "+words[i]:words[i];
      if(ctx.measureText(test).width>max){ ctx.fillText(line,x,yy); line=words[i]; yy+=lh; }
      else line=test;
    }
    if(line) ctx.fillText(line,x,yy);
  }
  function draw(){
    ctx.fillStyle="#160d04"; ctx.fillRect(0,0,W,H);
    for(var y=0;y<N;y++) for(var x=0;x<N;x++){
      ctx.fillStyle=((x+y)%2)? "#1d1206":"#241505";
      ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
    }
    if(warn) drawWarn(warn.x, warn.y);
    if(food) sprite(tung, food.x, food.y);
    if(cursed) sprite(god, cursed.x, cursed.y);
    if(foe) drawFoe(foe.x, foe.y);
    for(var i=snake.length-1;i>=0;i--){
      var s=snake[i];
      if(i===0) sprite(tung, s.x, s.y);
      else cell(s.x,s.y, i%2?"#c8823c":"#a9743c");
    }
    ctx.fillStyle="#f2c063"; ctx.font="bold 16px system-ui"; ctx.textAlign="left";
    ctx.fillText("sahurs "+score, 10, 22);
    ctx.fillStyle="#8a6a3a"; ctx.textAlign="right";
    ctx.fillText("best "+best, W-10, 22);
    if(state==="idle") overlay("Sahur Snake", "the hunger is already walking.");
    else if(state==="dead") overlay("consumed", deathLine());
  }
  function deathLine(){
    if(deathKind==="evil") return "evil tung tung tung sahur does not share the square.";
    return "the body found the body. such is lunch.";
  }
  function drawWarn(x,y){
    var pulse=0.45+0.55*Math.sin((clock||0)/110);
    var px=x*CELL+1, py=y*CELL+1, s=CELL-2;
    ctx.save();
    ctx.globalAlpha=0.28+0.42*pulse;
    ctx.fillStyle="#7a0c0c";
    ctx.strokeStyle="#ff3b1f";
    ctx.lineWidth=3;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(px,py,s,s,6); else ctx.rect(px,py,s,s);
    ctx.fill(); ctx.stroke();
    ctx.globalAlpha=0.55+0.45*pulse;
    ctx.strokeStyle="#f2c063";
    ctx.lineWidth=1.5;
    ctx.strokeRect(x*CELL+5.5,y*CELL+5.5,CELL-11,CELL-11);
    ctx.restore();
  }
  function drawFoe(x,y){
    var px=x*CELL+2, py=y*CELL+2, s=CELL-4;
    ctx.save();
    ctx.shadowColor="#ff2a12";
    ctx.shadowBlur=12;
    if(evil.complete && evil.naturalWidth){
      ctx.beginPath();
      if(ctx.roundRect) ctx.roundRect(px,py,s,s,6); else ctx.rect(px,py,s,s);
      ctx.clip();
      ctx.drawImage(evil,px,py,s,s);
    } else {
      ctx.fillStyle="#8b1010";
      ctx.fillRect(px,py,s,s);
    }
    ctx.restore();
    ctx.strokeStyle="#ff3b1f";
    ctx.lineWidth=2;
    ctx.strokeRect(px+0.5,py+0.5,s-1,s-1);
  }
  function updateHazard(now){
    if(state!=="play") return;
    if(!nextFoeAt) scheduleFoe(now);
    if(warn){
      if(now>=warn.until){
        if(!onSnake(warn.x, warn.y) && !(food && food.x===warn.x && food.y===warn.y) && !(cursed && cursed.x===warn.x && cursed.y===warn.y)){
          foe={x:warn.x, y:warn.y, until:now+STAY_MIN+Math.random()*STAY_SPAN};
        }
        warn=null;
        if(!foe) scheduleFoe(now);
      }
      return;
    }
    if(foe){
      if(now>=foe.until){
        foe=null;
        scheduleFoe(now);
      }
      return;
    }
    if(now>=nextFoeAt){
      var cell=pickClearCell();
      if(cell && !onSnake(cell.x, cell.y)){
        warn={x:cell.x, y:cell.y, until:now+WARN_MS};
      } else {
        scheduleFoe(now);
      }
    }
  }
  function loop(now){
    clock=now;
    if(!last) last=now;
    var dt=now-last; last=now;
    if(state==="play"){
      updateHazard(now);
      tickAcc+=dt;
      while(tickAcc>=STEP){ tickAcc-=STEP; if(state==="play") step(); }
    }
    draw();
    requestAnimationFrame(loop);
  }
  window.addEventListener("keydown", function(ev){
    var k=ev.key;
    if(k==="ArrowUp"||k==="w"||k==="W"){ ev.preventDefault(); setDir(0,-1); }
    if(k==="ArrowDown"||k==="s"||k==="S"){ ev.preventDefault(); setDir(0,1); }
    if(k==="ArrowLeft"||k==="a"||k==="A"){ ev.preventDefault(); setDir(-1,0); }
    if(k==="ArrowRight"||k==="d"||k==="D"){ ev.preventDefault(); setDir(1,0); }
  });
  var sx=0, sy=0;
  c.addEventListener("touchstart", function(ev){ var t=ev.changedTouches[0]; sx=t.clientX; sy=t.clientY; }, {passive:true});
  c.addEventListener("touchend", function(ev){
    var t=ev.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)<12 && Math.abs(dy)<12){ start(); return; }
    if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1, 0); else setDir(0, dy>0?1:-1);
  }, {passive:true});
  c.addEventListener("mousedown", function(){ if(state!=="play") start(); });
  reset();
  if(DEMO || /\bauto\b/.test(location.search||"")){
    setTimeout(function(){ if(state==="idle") start(); }, 900);
  }
  if(/\btest\b/.test(location.search||"")){
    window.__snake={
      get:function(){
        return {
          state:state, score:score, best:best, deathKind:deathKind, N:N,
          snake:snake.map(function(p){return {x:p.x,y:p.y};}),
          warn:warn&&{x:warn.x,y:warn.y},
          foe:foe&&{x:foe.x,y:foe.y},
          food:food&&{x:food.x,y:food.y}
        };
      },
      start:start,
      setDir:setDir,
      reset:reset,
      step:step,
      onSnake:onSnake,
      reserved:reserved,
      pickClearCell:pickClearCell,
      placeWarn:function(x,y,until){
        if(onSnake(x,y)) return false;
        foe=null; warn={x:x,y:y,until:until||0};
        return true;
      },
      placeFoe:function(x,y){
        if(onSnake(x,y)) return false;
        warn=null; foe={x:x,y:y,until:1e15};
        return true;
      }
    };
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
