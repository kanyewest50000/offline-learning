<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flappy Tung</title>
<link rel="stylesheet" href="tung.css">
</head>
<body>
  <div class="hud">
    <div>
      <h1>Flappy Tung</h1>
      <p class="line">gravity is inevitable. tung disagrees.</p>
    </div>
  </div>
  <div class="stage" style="--gw:420;--gh:640">
    <div class="frame"><canvas id="c" width="420" height="640"></canvas></div>
  </div>
  <p class="hint">click / tap / space to flap · after falling, tap to try again</p>
<script src="tung-fit.js"></script>
<script>
(function(){
  var W=420, H=640, GROUND=56;
  var c=document.getElementById("c"), ctx=c.getContext("2d");
  var tungImg=new Image(); tungImg.src="../../assets/tungtungtungsahur.png";
  /* oval body radii — flappy-bird capsule, not a circle */
  var bird={x:92,y:280,vy:0,bw:26,bh:18};
  var pipes=[], frame=0, score=0, best=0, state="idle";
  var GRAV=0.42, FLAP=-7.2, GAP=148, PW=54, SPEED=2.15;
  try{best=parseInt(localStorage.getItem("flappy-tung-best")||"0",10)||0;}catch(e){}

  function reset(){
    bird.y=280; bird.vy=0; pipes=[]; frame=0; score=0; state="idle";
  }
  function spawn(){
    var top=70+Math.random()*(H-GROUND-GAP-140);
    pipes.push({x:W+10, top:top, gap:GAP, passed:false});
  }
  function flap(){
    if(state==="dead") reset();
    if(state==="idle") state="play";
    bird.vy=FLAP;
  }
  function birdAngle(){
    return Math.max(-0.6, Math.min(0.9, bird.vy*0.06));
  }
  function toLocal(px, py){
    var a=birdAngle(), dx=px-bird.x, dy=py-bird.y;
    var cos=Math.cos(-a), sin=Math.sin(-a);
    return {x:dx*cos-dy*sin, y:dx*sin+dy*cos};
  }
  function inEllipse(lx, ly, cx, cy, rx, ry, rot){
    var dx=lx-cx, dy=ly-cy;
    if(rot){
      var cos=Math.cos(-rot), sin=Math.sin(-rot);
      var nx=dx*cos-dy*sin; dy=dx*sin+dy*cos; dx=nx;
    }
    return (dx*dx)/(rx*rx)+(dy*dy)/(ry*ry) <= 1;
  }
  function inBird(px, py){
    var p=toLocal(px, py);
    if(inEllipse(p.x, p.y, 0, 0, bird.bw, bird.bh, 0)) return true;
    return inEllipse(p.x, p.y, -16, 6, 15, 8, -0.35);
  }
  function hitRect(x,y,w,h){
    if(bird.x>=x && bird.x<=x+w && bird.y>=y && bird.y<=y+h) return true;
    var samples=[
      [Math.max(x, Math.min(bird.x, x+w)), Math.max(y, Math.min(bird.y, y+h))],
      [Math.max(x, Math.min(bird.x, x+w)), y],
      [Math.max(x, Math.min(bird.x, x+w)), y+h],
      [x, Math.max(y, Math.min(bird.y, y+h))],
      [x+w, Math.max(y, Math.min(bird.y, y+h))]
    ];
    for(var i=0;i<samples.length;i++) if(inBird(samples[i][0], samples[i][1])) return true;
    return false;
  }
  function hitPipe(p){
    return hitRect(p.x, 0, PW, p.top) || hitRect(p.x, p.top+p.gap, PW, H-GROUND-(p.top+p.gap));
  }
  function wood(x,y,w,h){
    ctx.fillStyle="#c8823c";
    ctx.strokeStyle="#7a5a1a";
    ctx.lineWidth=3;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,y,w,h,8); else ctx.rect(x,y,w,h);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle="#f2c06333";
    ctx.fillRect(x+6,y+4,6,Math.max(0,h-8));
  }
  function drawBird(){
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(birdAngle());
    var flap=state==="play" ? Math.max(-1.15, Math.min(0.85, -bird.vy*0.14)) : Math.sin(Date.now()/160)*0.22;
    ctx.save();
    ctx.translate(-2, 2);
    ctx.rotate(-0.35+flap);
    ctx.fillStyle="#a56a2c";
    ctx.strokeStyle="#5c3a14";
    ctx.lineWidth=1.75;
    ctx.beginPath();
    ctx.ellipse(-16, 6, 15, 7.5, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle="#d4a15a";
    ctx.beginPath();
    ctx.ellipse(-15, 5, 9, 4.2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.bw, bird.bh, 0, 0, Math.PI*2);
    ctx.save();
    ctx.clip();
    if(tungImg.complete && tungImg.naturalWidth){
      var sw=tungImg.naturalWidth, sh=tungImg.naturalHeight;
      var destW=bird.bw*2, destH=bird.bh*2;
      var srcH=sh*0.36, srcW=srcH*(destW/destH);
      var srcX=sw*0.26, srcY=sh*0.03;
      ctx.drawImage(tungImg, srcX, srcY, srcW, srcH, -bird.bw, -bird.bh, destW, destH);
    } else {
      ctx.fillStyle="#c8823c";
      ctx.fill();
    }
    ctx.restore();
    ctx.strokeStyle="#6a4418";
    ctx.lineWidth=2;
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.bw, bird.bh, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(bird.bw-4, -6);
    ctx.lineTo(bird.bw+14, -1);
    ctx.lineTo(bird.bw-4, 2);
    ctx.closePath();
    ctx.fillStyle="#f0b44a";
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(bird.bw-4, 1);
    ctx.lineTo(bird.bw+14, -1);
    ctx.lineTo(bird.bw-4, 7);
    ctx.closePath();
    ctx.fillStyle="#d4842a";
    ctx.fill();
    ctx.restore();
  }
  function overlay(title, sub){
    ctx.fillStyle="#1d1206f2";
    ctx.fillRect(24, H/2-90, W-48, 180);
    ctx.strokeStyle="#7a5a1a"; ctx.strokeRect(24, H/2-90, W-48, 180);
    ctx.fillStyle="#f2c063"; ctx.font="bold 22px system-ui"; ctx.textAlign="center";
    ctx.fillText(title, W/2, H/2-24);
    ctx.fillStyle="#c8823c"; ctx.font="italic 13px system-ui";
    wrap(sub, W/2, H/2+8, W-80, 18);
    ctx.fillStyle="#8a6a3a"; ctx.font="12px system-ui";
    ctx.fillText("tap to continue", W/2, H/2+62);
  }
  function wrap(t,x,y,max,lh){
    var words=t.split(" "), line="", yy=y;
    for(var i=0;i<words.length;i++){
      var test=line?line+" "+words[i]:words[i];
      if(ctx.measureText(test).width>max){ ctx.fillText(line,x,yy); line=words[i]; yy+=lh; }
      else line=test;
    }
    if(line) ctx.fillText(line,x,yy);
  }
  function tick(){
    if(state==="play"){
      frame++;
      bird.vy+=GRAV; bird.y+=bird.vy;
      if(frame%90===0) spawn();
      for(var i=pipes.length-1;i>=0;i--){
        pipes[i].x-=SPEED;
        if(!pipes[i].passed && pipes[i].x+PW<bird.x){
          pipes[i].passed=true; score++;
          if(score>best){best=score; try{localStorage.setItem("flappy-tung-best",String(best));}catch(e){}}
        }
        if(hitPipe(pipes[i])) state="dead";
        if(pipes[i].x<-PW-10) pipes.splice(i,1);
      }
      if(bird.y+bird.bh>H-GROUND || bird.y-bird.bh<0) state="dead";
    }
    ctx.fillStyle="#1d1206"; ctx.fillRect(0,0,W,H);
    var g=ctx.createRadialGradient(W/2,80,20,W/2,80,340);
    g.addColorStop(0,"#3a2410"); g.addColorStop(1,"#1d1206");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#f2c06322"; ctx.beginPath(); ctx.arc(W-70,70,28,0,Math.PI*2); ctx.fill();
    for(var p=0;p<pipes.length;p++){
      wood(pipes[p].x, 0, PW, pipes[p].top);
      wood(pipes[p].x, pipes[p].top+pipes[p].gap, PW, H-GROUND-(pipes[p].top+pipes[p].gap));
    }
    ctx.fillStyle="#241505"; ctx.fillRect(0,H-GROUND,W,GROUND);
    ctx.fillStyle="#7a5a1a"; ctx.fillRect(0,H-GROUND,W,3);
    ctx.fillStyle="#c8823c"; ctx.font="bold 11px system-ui"; ctx.textAlign="left";
    ctx.fillText("the floor does not wait. it collects.", 12, H-22);
    ctx.fillStyle="#f2c063"; ctx.font="bold 28px system-ui"; ctx.textAlign="center";
    ctx.fillText(String(score), W/2, 42);
    ctx.fillStyle="#8a6a3a"; ctx.font="11px system-ui";
    ctx.fillText("best "+best, W/2, 60);
    if(state==="idle") overlay("Flappy Tung", "the air does not hold him. he holds the air.");
    else if(state==="dead") overlay("fallen", "he stopped disagreeing. the ground finished the sentence.");
    drawBird();
    requestAnimationFrame(tick);
  }
  function onDown(ev){ ev.preventDefault(); flap(); }
  c.addEventListener("mousedown", onDown);
  c.addEventListener("touchstart", onDown, {passive:false});
  window.addEventListener("keydown", function(ev){
    if(ev.code==="Space" || ev.key===" "){ ev.preventDefault(); flap(); }
  });
  tick();
})();
</script>
</body>
</html>
